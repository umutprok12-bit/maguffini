buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        // Orijinal bozuk sunucu yerine 1.12.2 sorunlarını çözen topluluk yamasını kullanıyoruz
        classpath('com.anatawa12.forge:ForgeGradle:2.3-1.0.+') { changing = true }
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0"
group = "com.supraland.macguffin"
archivesBaseName = "supraland"

sourceCompatibility = targetCompatibility = '1.8'
compileJava { sourceCompatibility = targetCompatibility = '1.8' }

minecraft {
    // İstediğin 2859 sürümüne geri döndük!
    version = "1.12.2-14.23.5.2859"
    runDir = "run"
    mappings = "snapshot_20171003"
}
