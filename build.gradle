buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        // Eski bozuk 2.3 yerine modern ForgeGradle 5 kullanıyoruz
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'

version = "1.0"
group = "com.supraland.macguffin"
archivesBaseName = "supraland"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    // 1.12.2 için modern mapping formatı
    mappings channel: 'snapshot', version: '20171003-1.12'
}

repositories {
    mavenCentral()
}

dependencies {
    // Forge'un kendi ana dosyası (userdev aramaz, hatasız yükler)
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
}
