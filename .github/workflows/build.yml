name: Build 1.12.2 Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 4.9
    - name: Setup Decomp Workspace
      run: gradle setupDecompWorkspace
    - name: Build Mod
      run: gradle build
    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: Supraland-Mod-1.12.2
        path: build/libs/*.jar
